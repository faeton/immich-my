[project]
name = "teslacam"
version = "0.0.1"
description = "Tesla dashcam dumps → reviewed, trimmed, stack-ready render folders for Immich (via immy)."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "timezonefinder>=6.5",
    "cull",
]

[tool.uv.sources]
cull = { path = "../cull", editable = true }

[project.scripts]
teslacam = "teslacam.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teslacam"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9"]
