<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesla Dashcam — review</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --panel2:#1c2230; --line:#262d3a;
  --fg:#e6edf3; --dim:#8b98a9; --dim2:#5f6b7c;
  --honk:#f0a02a; --tap:#3fb950; --sentry:#8b7ff5; --aeb:#f4544c; --drive:#58a6ff; --saved:#3fb950; --unknown:#8b98a9;
  --accent:#58a6ff;
  --keep:#3fb950; --drop:#f4544c; --unrev:#f0a02a; --trig:#ff7b2b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
a{color:var(--accent)}

header{position:sticky;top:0;z-index:600;background:rgba(14,17,22,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1600px;margin:0 auto;padding:12px 20px}
.titlerow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums}
.sub b{color:var(--fg);font-weight:600}
.sub .k{color:var(--keep)}.sub .d{color:var(--drop)}.sub .u{color:var(--unrev)}
.budget{color:var(--dim2);font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}
.budget b{color:var(--dim);font-weight:600}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:11px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--dim);
  padding:5px 11px;border-radius:999px;cursor:pointer;font-size:12.5px;
  display:inline-flex;align-items:center;gap:6px;user-select:none;transition:.12s}
.chip:hover{border-color:var(--dim2);color:var(--fg)}
.chip.on{background:var(--panel2);color:var(--fg);border-color:var(--dim2)}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
.chip .n{color:var(--dim2);font-variant-numeric:tabular-nums;font-size:11.5px}
.chip.on .n{color:var(--dim)}
.chip.tagchip{border-style:dashed}
.chip.tagchip.on{border-style:solid;border-color:var(--accent)}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px}
input[type=search],select{background:var(--panel);border:1px solid var(--line);color:var(--fg);
  padding:6px 10px;border-radius:8px;font-size:12.5px;font-family:inherit;outline:none}
input[type=search]{min-width:210px}
input[type=search]:focus,select:focus{border-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--dim);padding:6px 11px;
  border-radius:8px;cursor:pointer;font-size:12.5px;font-family:inherit;white-space:nowrap}
.btn:hover{color:var(--fg);border-color:var(--dim2)}
.btn.on{color:var(--fg);background:var(--panel2);border-color:var(--dim2)}
.btn:disabled{opacity:.4;cursor:default}
.spacer{flex:1}

#map{height:380px;border-bottom:1px solid var(--line);display:none;background:var(--panel)}
#map.show{display:block}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel2);color:var(--fg)}
.leaflet-popup-content{margin:10px 12px;font-size:12.5px}
.leaflet-popup-content b{display:block;margin-bottom:2px}
.leaflet-container{background:#0b0e13}

main{max-width:1600px;margin:0 auto;padding:20px}
.triphead{display:flex;align-items:center;gap:12px;margin:26px 0 12px;padding-bottom:8px;
  border-bottom:1px solid var(--line)}
.triphead:first-child{margin-top:4px}
.triphead h2{font-size:14px;margin:0;font-weight:600}
.triphead .meta{color:var(--dim);font-size:12px;white-space:nowrap}
.triphead .cities{color:var(--dim2);font-size:12px;flex:1;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;
  cursor:pointer;transition:.14s;display:flex;flex-direction:column;position:relative}
.card:hover{border-color:var(--dim2);transform:translateY(-2px)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(88,166,255,.35)}
.card .th{position:relative;aspect-ratio:4/3;background:#000;overflow:hidden}
.card .th img{width:100%;height:100%;object-fit:cover;display:block}
.card .badge{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:6px;
  font-size:11px;font-weight:600;color:#0e1116;letter-spacing:.01em}
.card .kind{position:absolute;top:8px;right:8px;padding:2px 7px;border-radius:5px;
  font-size:10.5px;background:rgba(0,0,0,.7);color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.card .dur{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.75);
  padding:2px 7px;border-radius:5px;font-size:11px;font-variant-numeric:tabular-nums}
.card .dur span{color:var(--dim2)}
.card .ncam{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.75);
  padding:2px 7px;border-radius:5px;font-size:11px;color:var(--dim)}
.card .body{padding:9px 11px 11px;border-left:3px solid transparent}
.card .when{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.card .when .tz{color:var(--dim2)}
.card .city{font-size:13.5px;font-weight:550;margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.warn{color:var(--aeb);font-size:11px;margin-top:3px}
.warn.soft{color:var(--honk)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;min-height:18px}
.tag{background:var(--panel2);border:1px solid var(--line);color:var(--fg);font-size:11px;
  padding:1px 7px;border-radius:999px;white-space:nowrap;flex:none}
.tag.rm{cursor:pointer}.tag.rm:hover{border-color:var(--aeb);color:var(--aeb)}
.card .note{color:var(--dim);font-size:11.5px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .flags{font-size:10.5px;color:var(--dim2);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.card .flags span{border:1px solid var(--line);border-radius:4px;padding:0 5px}
/* review state */
.card.unreviewed .th::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 2px rgba(240,160,42,.55);pointer-events:none}
.card.keep .body{border-left-color:var(--keep)}
.card.drop .body{border-left-color:var(--drop)}
.card.drop{opacity:.5}
.card.drop:hover{opacity:.85}
.card .st{position:absolute;top:0;left:0;right:0;height:3px}
.card.keep .st{background:var(--keep)}.card.drop .st{background:var(--drop)}
.empty{color:var(--dim);text-align:center;padding:70px 0}
.empty code{color:var(--fg)}

/* ---- player ---- */
#overlay{position:fixed;inset:0;background:#080b10;z-index:900;display:none;flex-direction:column}
#overlay.show{display:flex}
.pbar{display:flex;align-items:center;gap:14px;padding:9px 18px;border-bottom:1px solid var(--line);flex:none}
.pbar .ttl{font-weight:600;font-size:14px}
.pbar .m{color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums}
.pbar .path{color:var(--dim2);font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px;cursor:pointer}
.x{border:none;background:var(--panel);color:var(--fg);width:30px;height:30px;border-radius:8px;
  cursor:pointer;font-size:17px;line-height:1}
.x:hover{background:var(--panel2)}

.stage{flex:1;display:flex;gap:12px;padding:12px 18px;min-height:0}
.main-cam{flex:1;min-width:0;position:relative;background:#000;border-radius:10px;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.main-cam video{width:100%;height:100%;object-fit:contain;background:#000}
.side{width:210px;flex:none;display:flex;flex-direction:column;gap:9px;overflow-y:auto}
.side .tile{position:relative;background:#000;border-radius:8px;overflow:hidden;cursor:pointer;
  border:2px solid transparent;aspect-ratio:4/3;flex:none}
.side .tile.act{border-color:var(--accent)}
.side .tile video{width:100%;height:100%;object-fit:cover;display:block}
.side .tile .lbl{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.85));
  font-size:10.5px;padding:11px 6px 4px;color:#dfe6ee}
.tile.off video,.cell.off video{opacity:.35}
.tile.off .lbl::after,.cell.off .camlabel::after{content:' · not exported';color:var(--dim)}
.camlabel{position:absolute;top:9px;left:11px;background:rgba(0,0,0,.65);padding:3px 8px;
  border-radius:6px;font-size:11.5px;color:#dfe6ee}
.camlabel kbd{margin-right:5px}

body.gridmode .stage{display:block;min-height:0}
body.gridmode .allgrid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:10px;height:100%}
.allgrid{display:none}
body.gridmode .main-cam,body.gridmode .side{display:none}
.allgrid .cell{position:relative;background:#000;border-radius:9px;overflow:hidden;min-height:0}
.allgrid .cell video{width:100%;height:100%;object-fit:cover;display:block}

.ctrl{flex:none;padding:8px 18px 14px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0}
.row .lbl{color:var(--dim);font-size:12px}
.row input[type=text]{background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:5px 9px;
  border-radius:8px;font-size:12.5px;font-family:inherit;outline:none}
.row input[type=text]:focus{border-color:var(--accent)}
#tagIn{min-width:160px}#noteIn{flex:1;min-width:220px}
.saved{color:var(--tap);font-size:11.5px;opacity:0;transition:.3s;white-space:nowrap}.saved.on{opacity:1}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--panel);color:var(--dim);padding:6px 13px;cursor:pointer;
  font-size:12.5px;font-family:inherit;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button:hover{color:var(--fg)}
.seg button.on{color:#0b1017;font-weight:650}
.seg button.on[data-v=keep]{background:var(--keep)}
.seg button.on[data-v=drop]{background:var(--drop)}
.seg button.on[data-v=unreviewed]{background:var(--unrev)}
.seg kbd{margin-left:6px;opacity:.7}
.seg button.on kbd{background:rgba(0,0,0,.25);border-color:rgba(0,0,0,.3);color:#0b1017}

.cams{display:inline-flex;gap:4px;flex-wrap:wrap}
.cams label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);
  color:var(--dim);padding:4px 9px;border-radius:999px;font-size:12px;cursor:pointer;user-select:none}
.cams label:hover{color:var(--fg)}
.cams label.on{color:var(--fg);border-color:var(--dim2);background:var(--panel2)}
.cams input{margin:0;accent-color:var(--accent)}
.tog{display:inline-flex;align-items:center;gap:5px;color:var(--dim);font-size:12px;cursor:pointer;user-select:none;
  border:1px solid var(--line);border-radius:8px;padding:4px 9px;background:var(--panel)}
.tog input{margin:0;accent-color:var(--accent)}
.tog.on{color:var(--fg);border-color:var(--dim2)}
.tog[data-k=archive].on{border-color:var(--sentry)}
.row .num{width:76px;font-variant-numeric:tabular-nums;text-align:right}
.row .num.bad{border-color:var(--aeb)}
.est{color:var(--dim2);font-size:11.5px;font-variant-numeric:tabular-nums}
.est b{color:var(--dim);font-weight:600}

.scrub{position:relative;height:30px;cursor:pointer;display:flex;align-items:center;margin-top:6px}
.track{position:absolute;left:0;right:0;height:5px;background:var(--panel2);border-radius:3px}
.played{position:absolute;left:0;height:5px;background:var(--accent);border-radius:3px;width:0;opacity:.85}
.ticks{position:absolute;left:0;right:0;height:5px;pointer-events:none}
.ticks i{position:absolute;top:-2px;width:1px;height:9px;background:var(--dim2);opacity:.55}
.ticks .snap{position:absolute;top:-6px;height:17px;background:rgba(63,185,80,.13);border-left:1px dashed rgba(63,185,80,.5);border-right:1px dashed rgba(63,185,80,.5)}
.ticks .range{position:absolute;top:-1px;height:7px;background:rgba(63,185,80,.42)}
.ticks .def{position:absolute;top:9px;height:2px;background:var(--dim2);opacity:.55}
.ticks .trig{position:absolute;top:-8px;width:0;height:0;margin-left:-5px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:7px solid var(--trig)}
.ticks .trig::after{content:'';position:absolute;left:-1px;top:0;width:2px;height:13px;background:var(--trig);opacity:.8}
.knob{position:absolute;width:12px;height:12px;background:#fff;border-radius:50%;
  margin-left:-6px;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.6);z-index:2}
.handle{position:absolute;top:1px;width:10px;height:28px;margin-left:-5px;cursor:ew-resize;z-index:3}
.handle::before{content:'';position:absolute;left:4px;top:0;width:2px;height:100%;background:var(--tap)}
.handle::after{content:'';position:absolute;left:1px;top:2px;width:8px;height:8px;border-radius:2px;background:var(--tap);border:1px solid #0b1017}
.handle.out::after{top:auto;bottom:2px}
.handle:hover::before{width:3px}

.crow{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.crow .t{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12.5px;white-space:nowrap}
.play{width:38px;height:38px;border-radius:50%;border:none;background:var(--accent);color:#0b1017;
  font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.hint{color:var(--dim2);font-size:11px;line-height:1.9}
kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
  padding:0 4px;font:11px ui-monospace,Menlo,monospace;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);
  color:var(--fg);padding:8px 14px;border-radius:9px;font-size:12.5px;z-index:1000;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:900px){.side{display:none}.stage{padding:10px}}
</style>
</head>
<body>

<header>
 <div class="hwrap">
  <div class="titlerow">
    <h1>Tesla Dashcam</h1>
    <span class="sub" id="stats"></span>
  </div>
  <div class="budget" id="budget"></div>
  <div class="filters" id="filters"></div>
 </div>
</header>

<div id="map"></div>
<main><div id="list"></div></main>

<div id="overlay">
  <div class="pbar">
    <span class="ttl" id="pCity"></span>
    <span class="m" id="pWhen"></span>
    <span class="m" id="pReason"></span>
    <span class="spacer"></span>
    <span class="path" id="pPath" title="click to copy the path"></span>
    <button class="btn" id="bGrid">Grid (G)</button>
    <button class="btn" id="bPrev" title="previous event (P)">←</button>
    <button class="btn" id="bNext" title="next event (N)">→</button>
    <button class="x" id="bClose" title="close (Esc)">✕</button>
  </div>
  <div class="stage">
    <div class="main-cam"><video id="vMain" playsinline muted preload="auto"></video>
      <span class="camlabel" id="mainLbl"></span></div>
    <div class="side" id="side"></div>
    <div class="allgrid" id="allgrid"></div>
  </div>
  <div class="ctrl">
    <div class="row">
      <span class="seg" id="keepSeg">
        <button data-v="keep">Keep<kbd>K</kbd></button>
        <button data-v="drop">Drop<kbd>D</kbd></button>
        <button data-v="unreviewed">Unreviewed<kbd>U</kbd></button>
      </span>
      <span class="lbl">Cameras</span>
      <span class="cams" id="camList"></span>
      <label class="tog" data-k="precise" title="re-encode the per-camera files to the exact in/out range instead of whole segments"><input type="checkbox" id="preciseIn">precise cut</label>
      <label class="tog" data-k="archive" title="archive in Immich after import"><input type="checkbox" id="archiveIn">archive</label>
      <span class="spacer"></span>
      <span class="est" id="est"></span>
    </div>
    <div class="row">
      <span class="lbl">Tags</span>
      <span class="tags" id="pTags"></span>
      <input type="text" id="tagIn" list="tagList" placeholder="tag + Enter (T)" autocomplete="off">
      <datalist id="tagList"></datalist>
      <input type="text" id="noteIn" placeholder="note">
      <span class="saved" id="saved"></span>
    </div>
    <div class="scrub" id="scrub">
      <div class="track"></div><div class="played" id="played"></div>
      <div class="ticks" id="ticks"></div><div class="knob" id="knob"></div>
      <div class="handle in" id="hIn" title="in"></div><div class="handle out" id="hOut" title="out"></div>
    </div>
    <div class="crow">
      <button class="play" id="bPlay">▶</button>
      <span class="t" id="tPos">0:00 / 0:00</span>
      <button class="btn" id="bSpeed">1×</button>
      <span class="sep"></span>
      <span class="lbl">In</span><input type="text" class="num" id="inIn" placeholder="0:00">
      <button class="btn" id="bSetIn" title="set in at the current time (I)">◀ here</button>
      <span class="lbl">Out</span><input type="text" class="num" id="outIn" placeholder="0:00">
      <button class="btn" id="bSetOut" title="set out at the current time (O)">here ▶</button>
      <button class="btn" id="bReset" title="back to the default window">Reset to default</button>
      <span class="t" id="snapTxt"></span>
      <span class="spacer"></span>
      <span class="hint"><kbd>K</kbd>/<kbd>D</kbd>/<kbd>U</kbd> keep/drop/unreviewed · <kbd>I</kbd>/<kbd>O</kbd> set in/out · <kbd>[</kbd>/<kbd>]</kbd> jump in/out · <kbd>T</kbd> trigger ·
        <kbd>1–6</kbd> camera · <kbd>space</kbd> play · <kbd>←/→</kbd> 5 s · <kbd>⇧←/→</kbd> 1 s · <kbd>,/.</kbd> segment · <kbd>N</kbd>/<kbd>P</kbd> next/prev · <kbd>G</kbd> grid · <kbd>esc</kbd> close</span>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';
/* ---------------- constants ---------------- */
const REASONS = {
  honk:   {label:'Honk',            c:'var(--honk)'},
  tapped: {label:'Tapped',          c:'var(--tap)'},
  sentry: {label:'Sentry',          c:'var(--sentry)'},
  aeb:    {label:'Emergency braking', c:'var(--aeb)'},
  drive:  {label:'Drive',           c:'var(--drive)'},
  saved:  {label:'Saved',           c:'var(--saved)'},
  unknown:{label:'Unknown',         c:'var(--unknown)'},
};
const REASON_ORDER = ['tapped','honk','sentry','aeb','saved','drive','unknown'];
const KINDS = {saved:'Saved clips', sentry:'Sentry clips', recent:'Recent clips'};
const STATES = {unreviewed:{label:'Unreviewed', c:'var(--unrev)'}, keep:{label:'Keep', c:'var(--keep)'}, drop:{label:'Drop', c:'var(--drop)'}};
const CAMS = {front:'Front', back:'Back', left_repeater:'Left repeater', right_repeater:'Right repeater',
  left_pillar:'Left pillar', right_pillar:'Right pillar'};
const MOSAIC_MBPS = 4, CHILD_MBPS = 5.5;
const DEFAULT_DEC = {keep:'unreviewed', cameras:null, in_s:null, out_s:null, precise:false, tags:[], note:'', archive:false, updated:null};

const slugOf = e => REASONS[e.reason_slug] ? e.reason_slug : 'unknown';
const colOf  = e => REASONS[slugOf(e)].c;
const labelOf= e => e.kind==='recent' && slugOf(e)==='unknown' ? 'Drive' : REASONS[slugOf(e)].label;
const camName= c => CAMS[c] || c.replace(/_/g,' ');
const pad = n => String(n).padStart(2,'0');
const fmtDur = s => { s=Math.max(0,Math.floor(s)); return `${Math.floor(s/60)}:${pad(s%60)}`; };
const fmtSec = s => { s=Math.max(0,s); const m=Math.floor(s/60), r=s-m*60; return `${m}:${r<10?'0':''}${r.toFixed(1)}`; };
const fmtH = s => (s/3600).toFixed(1)+' h';
const fmtGB = b => b>=1 ? b.toFixed(1)+' GB' : (b*1000).toFixed(0)+' MB';
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function parseTs(t){ if(!t) return new Date(0); const [d,h='00:00:00']=t.split('T');const [Y,M,D]=d.split('-').map(Number);
  const [hh,mm,ss]=h.split(':').map(Number);return new Date(Y,M-1,D,hh,mm,ss||0);}
function fmtDate(t){const d=parseTs(t);
  return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;}
const tzOf = e => e.offset_source==='none' || !e.offset ? '' : e.offset;
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const encPath = p => p.split('/').map(encodeURIComponent).join('/');
const mediaUrl = p => '/media/'+encPath(p);
/* thumbs live under <review_dir>/thumbs ("thumbs/<slug>.jpg"); older events.json files pointed under the dump root */
const thumbUrl = p => p.startsWith('thumbs/') ? '/thumbs/'+encPath(p.slice(7)) : mediaUrl(p);
function parseSec(s){ s=String(s).trim(); if(!s) return null;
  if(s.includes(':')){ const p=s.split(':').map(Number); if(p.some(isNaN)) return null;
    return p.length===3 ? p[0]*3600+p[1]*60+p[2] : p[0]*60+p[1]; }
  const v=Number(s); return isNaN(v)?null:v; }

/* ---------------- data ---------------- */
let EVENTS=[], DEC={}, META={};
const decOf = e => DEC[e.id] || DEFAULT_DEC;
const tagsOf = e => decOf(e).tags || [];
const noteOf = e => decOf(e).note || '';
const stateOf= e => decOf(e).keep || 'unreviewed';
const camsOf = e => { const c=decOf(e).cameras; return c==null ? e.cams.slice() : e.cams.filter(x=>c.includes(x)); };
function defaultWindow(e){
  const T=e.total||0, t=e.trigger_s;
  let a=0,b=T;
  if(t!=null && e.kind==='saved'){ a=t-180; b=t+30; }
  else if(t!=null && e.kind==='sentry'){ a=t-60; b=t+60; }
  a=Math.max(0,Math.min(T,a)); b=Math.max(0,Math.min(T,b)); if(b<=a) b=T;
  return [a,b];
}
function windowOf(e){
  const d=decOf(e), [da,db]=defaultWindow(e), T=e.total||0;
  let a=d.in_s==null?da:d.in_s, b=d.out_s==null?db:d.out_s;
  a=Math.max(0,Math.min(T,a)); b=Math.max(0,Math.min(T,b)); if(b<=a) b=Math.min(T,a+1);
  return [a,b];
}
function segBounds(e){ const o=[]; let acc=0; for(const s of e.segs){ o.push([acc,acc+s.d]); acc+=s.d; } return o; }
/* union of whole segments overlapping [a,b) — what `-c copy` concat of the children will cover */
function snappedOf(e,[a,b]){
  let lo=null,hi=null;
  for(const [s0,s1] of segBounds(e)){ if(s0<b && s1>a){ if(lo==null||s0<lo) lo=s0; if(hi==null||s1>hi) hi=s1; } }
  return lo==null ? [a,b] : [lo,hi];
}
function estimateOf(e){
  const w=windowOf(e), d=decOf(e), n=camsOf(e).length;
  const mosaic=w[1]-w[0], child=d.precise ? mosaic : (()=>{const s=snappedOf(e,w); return s[1]-s[0];})();
  const bytes=(mosaic*MOSAIC_MBPS + child*n*CHILD_MBPS)*1e6/8;
  return {mosaic, child, n, gb:bytes/1e9};
}
function tagCounts(){ const m=new Map(); for(const e of EVENTS) for(const t of tagsOf(e)) m.set(t,(m.get(t)||0)+1);
  return [...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])); }

async function loadAll(){
  const r=await fetch('/api/events',{cache:'no-store'});
  if(!r.ok){ const err=await r.json().catch(()=>({})); throw new Error(err.error||('HTTP '+r.status)); }
  const data=await r.json(); META=data; EVENTS=data.events||[];
  const d=await fetch('/api/decisions',{cache:'no-store'}); DEC=d.ok?await d.json():{};
  EVENTS.forEach(e=>{ e._d=parseTs(e.ts); e.cams=e.cams||[]; e.segs=e.segs||[]; e.total=e.total||0; });
  buildTrips();
}

/* --- trips: split the timeline wherever a gap exceeds 4 days --- */
let trips=[];
function buildTrips(){
  const sorted=[...EVENTS].sort((a,b)=>a._d-b._d);
  trips=[]; let cur=null;
  for(const e of sorted){
    if(!cur || (e._d-cur.end)/86400000>4){ cur={evs:[],start:e._d,end:e._d}; trips.push(cur); }
    cur.evs.push(e); cur.end=e._d; e._trip=trips.length-1;
  }
  trips.forEach((t,i)=>{
    t.id=i; t.cities=[...new Set(t.evs.map(e=>e.city).filter(Boolean))];
    const a=t.start,b=t.end;
    t.label = a.toDateString()===b.toDateString()
      ? `${a.getDate()} ${MON[a.getMonth()]} ${a.getFullYear()}`
      : (a.getFullYear()===b.getFullYear()
          ? `${a.getDate()} ${MON[a.getMonth()]} — ${b.getDate()} ${MON[b.getMonth()]} ${b.getFullYear()}`
          : `${a.getDate()} ${MON[a.getMonth()]} ${a.getFullYear()} — ${b.getDate()} ${MON[b.getMonth()]} ${b.getFullYear()}`);
  });
}

/* ---------------- saving ---------------- */
let rerenderTimer=null;
async function save(e, patch){
  try{
    const r=await fetch('/api/decisions',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:e.id,...patch})});
    if(!r.ok){ const err=await r.json().catch(()=>({})); flashSaved(false, err.error); return false; }
    DEC[e.id]=await r.json(); flashSaved(true);
  }catch(err){ flashSaved(false, 'server unreachable'); return false; }
  if(P && P.ev===e) refreshReview();
  clearTimeout(rerenderTimer); rerenderTimer=setTimeout(()=>render(false),200);
  return true;
}
function flashSaved(ok,msg){ const s=document.getElementById('saved');
  s.textContent=ok?'saved ✓':('not saved'+(msg?': '+msg:'')); s.style.color=ok?'var(--tap)':'var(--aeb)';
  s.classList.add('on'); clearTimeout(s._t); s._t=setTimeout(()=>s.classList.remove('on'),ok?1400:4000); }
let toastT=null;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1600); }

/* ---------------- filter state ---------------- */
const state={kinds:new Set(), reasons:new Set(), states:new Set(), dump:'', trip:'', q:'', order:'desc', tag:''};
function passes(e, skip){
  if(skip!=='kinds' && state.kinds.size && !state.kinds.has(e.kind)) return false;
  if(skip!=='reasons' && state.reasons.size && !state.reasons.has(slugOf(e))) return false;
  if(skip!=='states' && state.states.size && !state.states.has(stateOf(e))) return false;
  if(skip!=='dump' && state.dump && e.dump!==state.dump) return false;
  if(skip!=='trip' && state.trip!=='' && e._trip!=+state.trip) return false;
  if(skip!=='tag' && state.tag && !tagsOf(e).includes(state.tag)) return false;
  if(state.q){
    const s=[e.city,labelOf(e),e.reason,e.ts,e.dir,e.dump,e.kind,tagsOf(e).join(' '),noteOf(e)].join(' ').toLowerCase();
    for(const w of state.q.toLowerCase().split(/\s+/).filter(Boolean)) if(!s.includes(w)) return false;
  }
  return true;
}
function visible(){
  const r=EVENTS.filter(e=>passes(e));
  r.sort((a,b)=> state.order==='desc' ? b._d-a._d : a._d-b._d);
  return r;
}
const countIf=(skip,fn)=>EVENTS.reduce((n,e)=>n+(passes(e,skip)&&fn(e)?1:0),0);

function chip(f, cls, html, on, onclick){
  const c=document.createElement('div'); c.className='chip'+cls+(on?' on':''); c.innerHTML=html; c.onclick=onclick; f.appendChild(c); return c;
}
function buildFilters(){
  const f=document.getElementById('filters'); f.innerHTML='';
  for(const [k,lab] of Object.entries(STATES)){
    const n=countIf('states',e=>stateOf(e)===k);
    chip(f,'',`<span class="dot" style="background:${lab.c}"></span>${lab.label}<span class="n">${n}</span>`,state.states.has(k),
      ()=>{state.states.has(k)?state.states.delete(k):state.states.add(k);render();});
  }
  f.insertAdjacentHTML('beforeend','<div class="sep"></div>');
  for(const [k,lab] of Object.entries(KINDS)){
    const n=countIf('kinds',e=>e.kind===k); if(!EVENTS.some(e=>e.kind===k)) continue;
    chip(f,'',`${lab}<span class="n">${n}</span>`,state.kinds.has(k),
      ()=>{state.kinds.has(k)?state.kinds.delete(k):state.kinds.add(k);render();});
  }
  f.insertAdjacentHTML('beforeend','<div class="sep"></div>');
  for(const k of REASON_ORDER){
    if(!EVENTS.some(e=>slugOf(e)===k)) continue;
    const n=countIf('reasons',e=>slugOf(e)===k);
    chip(f,'',`<span class="dot" style="background:${REASONS[k].c}"></span>${REASONS[k].label}<span class="n">${n}</span>`,state.reasons.has(k),
      ()=>{state.reasons.has(k)?state.reasons.delete(k):state.reasons.add(k);render();});
  }
  f.insertAdjacentHTML('beforeend','<div class="sep"></div>');
  const dumps=[...new Set(EVENTS.map(e=>e.dump))].sort();
  if(dumps.length>1){
    const sel=document.createElement('select');
    sel.innerHTML='<option value="">All dumps</option>'+dumps.map(d=>`<option value="${esc(d)}">${esc(d)} (${countIf('dump',e=>e.dump===d)})</option>`).join('');
    sel.value=state.dump; sel.onchange=()=>{state.dump=sel.value;render();}; f.appendChild(sel);
  }
  const sel=document.createElement('select');
  sel.innerHTML='<option value="">All trips</option>'+trips.map(t=>
    `<option value="${t.id}">${t.label} · ${esc(t.cities.slice(0,2).join(', '))}${t.cities.length>2?'…':''} (${t.evs.length})</option>`
  ).reverse().join('');
  sel.value=state.trip; sel.onchange=()=>{state.trip=sel.value;render();}; f.appendChild(sel);
  const q=document.createElement('input'); q.type='search'; q.placeholder='City, date, tag, note…'; q.value=state.q;
  q.oninput=()=>{state.q=q.value;render(false);}; f.appendChild(q);
  const tc=tagCounts();
  if(tc.length){
    f.insertAdjacentHTML('beforeend','<span class="sep"></span>');
    for(const [t,n] of tc.slice(0,24))
      chip(f,' tagchip',`#${esc(t)}<span class="n">${n}</span>`,state.tag===t,()=>{state.tag=state.tag===t?'':t;render(false);});
  }
  f.insertAdjacentHTML('beforeend','<div class="spacer"></div>');
  const so=document.createElement('button'); so.className='btn';
  so.textContent=state.order==='desc'?'Newest first':'Oldest first';
  so.onclick=()=>{state.order=state.order==='desc'?'asc':'desc';render();}; f.appendChild(so);
  const mb=document.createElement('button'); mb.className='btn'+(mapOn?' on':'');
  mb.textContent='Map'; mb.onclick=toggleMap; f.appendChild(mb);
}

let shown=[], selIdx=-1;
function render(refit=true){
  shown=visible();
  const kept=EVENTS.filter(e=>stateOf(e)==='keep'), dropped=EVENTS.filter(e=>stateOf(e)==='drop');
  const unrev=EVENTS.length-kept.length-dropped.length;
  const totalS=EVENTS.reduce((a,e)=>a+e.total,0);
  document.getElementById('stats').innerHTML=
    `<b>${shown.length}</b> of ${EVENTS.length} events · <span class="k">${kept.length} kept</span> · <span class="d">${dropped.length} dropped</span> · <span class="u">${unrev} unreviewed</span> · ${fmtH(totalS)} total · ${trips.length} trips`;
  let keptS=0, gb=0, childS=0;
  for(const e of kept){ const est=estimateOf(e); keptS+=est.mosaic; childS+=est.child*est.n; gb+=est.gb; }
  document.getElementById('budget').innerHTML = kept.length
    ? `Review budget: <b>${kept.length}</b> kept · mosaic <b>${(keptS/60).toFixed(1)} min</b> · children <b>${(childS/60).toFixed(1)} min</b> · ≈ <b>${fmtGB(gb)}</b> (mosaic ${MOSAIC_MBPS} Mbps + ${CHILD_MBPS} Mbps per camera)`
    : 'Review budget: nothing kept yet';
  const list=document.getElementById('list'); list.innerHTML='';
  if(!shown.length){ list.innerHTML=`<div class="empty">${EVENTS.length?'Nothing matches the filters':'No events — run <code>teslacam scan</code> first'}</div>`; buildFilters(); return; }
  const order=[...new Set(shown.map(e=>e._trip))];
  for(const tid of order){
    const evs=shown.filter(e=>e._trip===tid), t=trips[tid];
    const h=document.createElement('div'); h.className='triphead';
    const k=evs.filter(e=>stateOf(e)==='keep').length;
    h.innerHTML=`<h2>${t.label}</h2><span class="meta">${evs.length} events${k?` · ${k} kept`:''}</span><span class="cities">${esc(t.cities.join(' · '))}</span>`;
    list.appendChild(h);
    const g=document.createElement('div'); g.className='grid';
    for(const e of evs) g.appendChild(card(e));
    list.appendChild(g);
  }
  if(selIdx>=shown.length) selIdx=shown.length-1;
  markSel(false);
  buildFilters();
  if(mapOn) drawMap(refit);
}

function card(e){
  const d=document.createElement('div'); d.className='card '+stateOf(e); d.dataset.id=e.id;
  d.onclick=()=>{ selIdx=shown.indexOf(e); openEvent(e); };
  const w=windowOf(e), cams=camsOf(e), tz=tzOf(e);
  const flags=[];
  if(e.gps_source==='none' || e.lat==null || e.lon==null) flags.push('<span class="warn soft" style="margin:0">no GPS</span>');
  if(e.offset_source==='none') flags.push('<span class="warn soft" style="margin:0">tz?</span>');
  if(e.gps_source==='prev-drive') flags.push('<span title="GPS from the previous drive">GPS≈</span>');
  if(decOf(e).precise) flags.push('<span title="exact re-encode">precise</span>');
  if(decOf(e).archive) flags.push('<span title="archived in Immich">archive</span>');
  d.innerHTML=`
    <div class="st"></div>
    <div class="th">
      ${e.thumb?`<img loading="lazy" src="${thumbUrl(e.thumb)}" alt="">`:''}
      <span class="badge" style="background:${colOf(e)}">${labelOf(e)}</span>
      <span class="kind">${KINDS[e.kind]||esc(e.kind)}</span>
      <span class="ncam">${cams.length===e.cams.length?`${e.cams.length} cam`:`${cams.length}/${e.cams.length} cam`}</span>
      <span class="dur">${fmtDur(w[1]-w[0])} <span>/ ${fmtDur(e.total)}</span></span>
    </div>
    <div class="body">
      <div class="when">${fmtDate(e.ts)} <span class="tz">${tz||'tz?'}</span></div>
      <div class="city">${esc(e.city||'—')}${e.gps_source==='sei'?' <span title="GPS from in-video telemetry" style="color:var(--dim2)">≈</span>':''}</div>
      ${e.bad?`<div class="warn">${e.bad} unreadable file${e.bad>1?'s':''}</div>`:''}
      ${flags.length?`<div class="flags">${flags.join('')}</div>`:''}
      <div class="tags">${tagsOf(e).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>
      ${noteOf(e)?`<div class="note">${esc(noteOf(e))}</div>`:''}
    </div>`;
  return d;
}
function markSel(scroll){
  document.querySelectorAll('.card.sel').forEach(c=>c.classList.remove('sel'));
  if(selIdx<0||selIdx>=shown.length) return;
  const el=document.querySelector(`.card[data-id="${CSS.escape(shown[selIdx].id)}"]`);
  if(el){ el.classList.add('sel'); if(scroll) el.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}

/* ---------------- map ---------------- */
let map=null, layer=null, mapOn=false;
function toggleMap(){
  mapOn=!mapOn;
  document.getElementById('map').classList.toggle('show',mapOn);
  if(mapOn){
    if(!map){
      map=L.map('map',{scrollWheelZoom:false}).setView([50,10],4);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
        {maxZoom:19,attribution:'© OpenStreetMap, © CARTO'}).addTo(map);
    }
    setTimeout(()=>map.invalidateSize(),60);
    drawMap(true);
  }
  buildFilters();
}
const cssVar = v => getComputedStyle(document.body).getPropertyValue(v.replace('var(','').replace(')','')).trim()||'#888';
function drawMap(refit){
  if(!map) return;
  if(layer) layer.remove();
  layer=L.layerGroup().addTo(map);
  const pts=[];
  for(const e of shown){
    if(e.lat==null||e.lon==null) continue;
    pts.push([e.lat,e.lon]);
    const st=stateOf(e);
    const m=L.circleMarker([e.lat,e.lon],{radius:st==='drop'?4:6,weight:2,color:st==='drop'?'#777':'#fff',opacity:.85,
      fillColor:cssVar(STATES[st].c), fillOpacity:st==='drop'?.5:.92}).addTo(layer);
    m.bindPopup(`<b>${esc(e.city)}</b>${fmtDate(e.ts)}<br>${labelOf(e)} · ${fmtDur(e.total)} · ${STATES[st].label}`);
    m.on('click',()=>openEvent(e));
  }
  if(refit && pts.length) map.fitBounds(L.latLngBounds(pts).pad(.15));
}

/* ---------------- player ---------------- */
const ov=document.getElementById('overlay');
const vMain=document.getElementById('vMain');
let P=null;   // {ev, cams, offs, total, seg, vids[], mainCam, speed}

/* Removing the src attribute alone does NOT free the decoder: the element keeps
   its media resource until load() runs the resource selection again. Chrome caps
   media players per page (~75); leaked ones turn every later player black. */
function release(v){ v.pause(); v.removeAttribute('src'); v.load(); }
function openEvent(e){
  if(P) { pauseAll(); for(const v of P.vids) release(v); }
  const cams=e.cams.slice();
  const offs=[]; let acc=0;
  for(const s of e.segs){ offs.push(acc); acc+=s.d; }
  P={ev:e, cams, offs, total:acc||e.total, seg:-1, vids:[], mainVids:[], gridVids:[],
     mainCam:cams.includes('front')?'front':cams[0], speed:P?P.speed:1, playing:false, pendingSeek:null};
  selIdx=shown.indexOf(e);

  document.getElementById('pCity').textContent=e.city||'—';
  document.getElementById('pWhen').textContent=fmtDate(e.ts)+(tzOf(e)?' '+tzOf(e):' (tz?)');
  const r=document.getElementById('pReason');
  r.textContent=`${labelOf(e)} · ${KINDS[e.kind]||e.kind}`; r.style.color=colOf(e);
  const pp=document.getElementById('pPath');
  pp.textContent=e.dir;
  pp.onclick=()=>{navigator.clipboard.writeText((META.root?META.root+'/':'')+e.dir).then(()=>{
    pp.textContent='copied ✓'; setTimeout(()=>pp.textContent=e.dir,1200);});};
  document.getElementById('bSpeed').textContent=P.speed+'×';

  refreshReview();
  buildTiles();
  const w=windowOf(e);
  ov.classList.add('show');
  document.body.style.overflow='hidden';
  seekGlobal(w[0], false);   // start at the in point; loads the right segment
}

/* ---- review bar ---- */
function refreshReview(){
  if(!P) return;
  const e=P.ev, d=decOf(e);
  document.querySelectorAll('#keepSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===d.keep));
  const cl=document.getElementById('camList'); cl.innerHTML='';
  const chosen=camsOf(e);
  e.cams.forEach((cam,i)=>{
    const on=chosen.includes(cam);
    const l=document.createElement('label'); l.className=on?'on':''; l.title=`main camera: ${i+1}`;
    l.innerHTML=`<input type="checkbox" ${on?'checked':''}><span>${camName(cam)}</span>`;
    l.querySelector('input').onchange=ev=>{
      let next=on?chosen.filter(c=>c!==cam):e.cams.filter(c=>chosen.includes(c)||c===cam);
      save(e,{cameras: next.length===e.cams.length?null:next});
    };
    cl.appendChild(l);
  });
  for(const k of ['precise','archive']){ const i=document.getElementById(k+'In'); i.checked=!!d[k]; i.parentElement.classList.toggle('on',!!d[k]); }
  // tags + note
  const box=document.getElementById('pTags'); box.innerHTML='';
  for(const t of tagsOf(e)){
    const s=document.createElement('span'); s.className='tag rm'; s.textContent='#'+t; s.title='remove';
    s.onclick=()=>save(e,{tags:tagsOf(e).filter(x=>x!==t)});
    box.appendChild(s);
  }
  document.getElementById('tagList').innerHTML=tagCounts().map(([t])=>`<option value="${esc(t)}">`).join('');
  const ni=document.getElementById('noteIn'); if(document.activeElement!==ni) ni.value=noteOf(e);
  // window
  const w=windowOf(e), snap=snappedOf(e,w), [da,db]=defaultWindow(e);
  const ii=document.getElementById('inIn'), oi=document.getElementById('outIn');
  if(document.activeElement!==ii) ii.value=fmtSec(w[0]); if(document.activeElement!==oi) oi.value=fmtSec(w[1]);
  ii.classList.remove('bad'); oi.classList.remove('bad');
  const isDef=d.in_s==null&&d.out_s==null;
  document.getElementById('bReset').disabled=isDef;
  document.getElementById('snapTxt').textContent = d.precise
    ? `exact ${fmtDur(w[1]-w[0])}`
    : `children snap to ${fmtDur(snap[0])}–${fmtDur(snap[1])} (${fmtDur(snap[1]-snap[0])})`;
  const est=estimateOf(e);
  document.getElementById('est').innerHTML=
    `mosaic <b>${fmtDur(est.mosaic)}</b> + <b>${est.n}</b> × <b>${fmtDur(est.child)}</b> ≈ <b>${fmtGB(est.gb)}</b>`;
  // tiles reflect the camera choice
  document.querySelectorAll('#side .tile,#allgrid .cell').forEach(t=>t.classList.toggle('off',!chosen.includes(t.dataset.cam)));
  buildTicks();
}
document.querySelectorAll('#keepSeg button').forEach(b=>b.onclick=()=>P&&setKeep(b.dataset.v));
function setKeep(v){ if(!P) return; save(P.ev,{keep:v}); toast(STATES[v].label); }
for(const k of ['precise','archive']) document.getElementById(k+'In').onchange=ev=>P&&save(P.ev,{[k]:ev.target.checked});
document.getElementById('bReset').onclick=()=>P&&save(P.ev,{in_s:null,out_s:null});
document.getElementById('bSetIn').onclick=()=>setMark('in');
document.getElementById('bSetOut').onclick=()=>setMark('out');

function setWindow(a,b){   // a/b: number | null(default) | undefined(unchanged)
  const e=P.ev, d=decOf(e), T=P.total, w=windowOf(e);
  const na = a===undefined ? d.in_s : a, nb = b===undefined ? d.out_s : b;
  const ea = na==null ? defaultWindow(e)[0] : na, eb = nb==null ? defaultWindow(e)[1] : nb;
  if(ea<0||eb>T+.01||ea>=eb){ toast('in must be before out, inside the event'); return false; }
  return save(e,{in_s:na==null?null:Math.round(na*10)/10, out_s:nb==null?null:Math.round(nb*10)/10});
}
function setMark(k){
  if(!P) return;
  const t=Math.round(globalTime()*10)/10;
  k==='in' ? setWindow(t,undefined) : setWindow(undefined,t);
}
(function wireWindowInputs(){
  for(const [id,k] of [['inIn','in'],['outIn','out']]){
    const el=document.getElementById(id);
    el.addEventListener('keydown',ev=>{ ev.stopPropagation(); if(ev.key==='Enter'||ev.key==='Escape'){ ev.preventDefault(); el.blur(); } });
    el.addEventListener('change',()=>{ if(!P) return; const v=parseSec(el.value);
      if(v==null){ el.classList.add('bad'); return; }
      const ok = k==='in' ? setWindow(v,undefined) : setWindow(undefined,v);
      if(ok===false) el.classList.add('bad'); });
  }
})();

(function wireTagEditor(){
  const ti=document.getElementById('tagIn'), ni=document.getElementById('noteIn');
  ti.addEventListener('keydown',ev=>{
    ev.stopPropagation();
    if(ev.key==='Enter'){ ev.preventDefault();
      const add=ti.value.split(/[,;]+/).map(x=>x.trim().replace(/^#/,'').toLowerCase()).filter(Boolean);
      if(add.length){ save(P.ev,{tags:[...new Set(tagsOf(P.ev).concat(add))]}); ti.value=''; }
      else ti.blur();
    } else if(ev.key==='Backspace' && !ti.value){ const t=tagsOf(P.ev); if(t.length) save(P.ev,{tags:t.slice(0,-1)}); }
    else if(ev.key==='Escape'){ ti.blur(); }
  });
  let noteT=null;
  const pushNote=()=>{ if(P && ni.value.trim()!==noteOf(P.ev)) save(P.ev,{note:ni.value.trim()}); };
  ni.addEventListener('keydown',ev=>{ ev.stopPropagation();
    if(ev.key==='Enter'||ev.key==='Escape'){ ev.preventDefault(); ni.blur(); } });
  ni.addEventListener('input',()=>{ clearTimeout(noteT); noteT=setTimeout(pushNote,700); });
  ni.addEventListener('change',()=>{ clearTimeout(noteT); pushNote(); });
})();

/* ---- tiles ---- */
/* One <video> per (slot, camera) for the life of the page. Tiles are rebuilt on
   every camera swap, grid toggle and event; creating fresh elements each time
   left the detached ones holding their decoders (see release()). */
const VPOOL={side:{}, grid:{}};
function pooled(slot, cam){
  let v=VPOOL[slot][cam];
  if(!v){
    v=document.createElement('video'); v.muted=true; v.playsInline=true; v.preload='auto';
    v.dataset.cam=cam; armRetry(v); VPOOL[slot][cam]=v;
  }
  return v;
}
function buildTiles(){
  const side=document.getElementById('side'), all=document.getElementById('allgrid');
  for(const v of P.vids) if(v!==vMain) release(v);
  side.innerHTML=''; all.innerHTML='';
  P.mainVids=[vMain]; P.gridVids=[];
  const chosen=camsOf(P.ev);
  document.getElementById('mainLbl').innerHTML=`<kbd>${P.cams.indexOf(P.mainCam)+1}</kbd>${camName(P.mainCam)}`;
  P.cams.forEach((cam,i)=>{
    if(cam!==P.mainCam){
      const t=document.createElement('div'); t.className='tile'+(chosen.includes(cam)?'':' off'); t.dataset.cam=cam;
      const v=pooled('side', cam); t.appendChild(v);
      t.insertAdjacentHTML('beforeend',`<span class="lbl"><kbd>${i+1}</kbd> ${camName(cam)}</span>`);
      t.onclick=()=>swapMain(cam);
      side.appendChild(t); P.mainVids.push(v);
    }
    const c=document.createElement('div'); c.className='cell'+(chosen.includes(cam)?'':' off'); c.dataset.cam=cam;
    const gv=pooled('grid', cam); c.appendChild(gv);
    c.insertAdjacentHTML('beforeend',`<span class="camlabel"><kbd>${i+1}</kbd>${camName(cam)}</span>`);
    all.appendChild(c); P.gridVids.push(gv);
  });
  vMain.dataset.cam=P.mainCam;
  P.vids=P.mainVids.concat(P.gridVids);
}
/* only the videos of the currently visible layout get a src — otherwise every
   camera would decode twice (large/side tile AND grid cell) */
const isGrid=()=>document.body.classList.contains('gridmode');
const modeVids=()=>isGrid()?P.gridVids:P.mainVids;
function swapMain(cam){
  if(!P || !P.cams.includes(cam) || cam===P.mainCam) return;
  const t=globalTime(), wasPlaying=P.playing;
  P.mainCam=cam; buildTiles(); if(P.seg>=0) loadSeg(P.seg, t-P.offs[P.seg], wasPlaying);
}

/* ---- scrub bar ---- */
const pct = t => (P.total ? Math.max(0,Math.min(100,t/P.total*100)) : 0)+'%';
function buildTicks(){
  if(!P) return;
  const el=document.getElementById('ticks'); el.innerHTML='';
  const e=P.ev;
  P.offs.forEach((o,i)=>{ if(!i) return; const s=document.createElement('i'); s.style.left=pct(o); el.appendChild(s); });
  const w=windowOf(e), snap=snappedOf(e,w), [da,db]=defaultWindow(e);
  if(!decOf(e).precise){ const r=document.createElement('div'); r.className='snap'; r.title=`segments copied for the children: ${fmtDur(snap[0])}–${fmtDur(snap[1])}`;
    r.style.left=pct(snap[0]); r.style.width=((snap[1]-snap[0])/P.total*100)+'%'; el.appendChild(r); }
  const dd=document.createElement('div'); dd.className='def'; dd.title=`default window ${fmtDur(da)}–${fmtDur(db)}`;
  dd.style.left=pct(da); dd.style.width=((db-da)/P.total*100)+'%'; el.appendChild(dd);
  const r=document.createElement('div'); r.className='range'; r.title=`in ${fmtSec(w[0])} · out ${fmtSec(w[1])}`;
  r.style.left=pct(w[0]); r.style.width=((w[1]-w[0])/P.total*100)+'%'; el.appendChild(r);
  if(e.trigger_s!=null){ const m=document.createElement('div'); m.className='trig'; m.title='trigger '+fmtSec(e.trigger_s); m.style.left=pct(e.trigger_s); el.appendChild(m); }
  const hi=document.getElementById('hIn'), ho=document.getElementById('hOut');
  hi.style.left=pct(w[0]); ho.style.left=pct(w[1]); hi.title='in '+fmtSec(w[0]); ho.title='out '+fmtSec(w[1]);
}
const scrub=document.getElementById('scrub');
const xToT = x => { const r=scrub.getBoundingClientRect(); return Math.max(0,Math.min(P.total,(x-r.left)/r.width*P.total)); };
scrub.addEventListener('mousedown',ev=>{
  if(!P) return;
  const h=ev.target.closest('.handle');
  if(h){ // drag an in/out handle; saved on release
    ev.preventDefault(); const k=h.id==='hIn'?'in':'out'; const w=windowOf(P.ev); let cur=w[k==='in'?0:1];
    const other=w[k==='in'?1:0];
    const mv=x=>{ let t=xToT(x.clientX); if(k==='in') t=Math.min(t,other-.5); else t=Math.max(t,other+.5); cur=Math.round(t*10)/10;
      h.style.left=pct(cur); const r=document.querySelector('#ticks .range');
      if(r){ const a=k==='in'?cur:w[0], b=k==='in'?w[1]:cur; r.style.left=pct(a); r.style.width=((b-a)/P.total*100)+'%'; }
      document.getElementById(k==='in'?'inIn':'outIn').value=fmtSec(cur); seekGlobal(cur, false); };
    const up=()=>{ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up);
      k==='in' ? setWindow(cur,undefined) : setWindow(undefined,cur); };
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up); return;
  }
  const sc=x=>seekGlobal(xToT(x.clientX)); sc(ev);
  const up=()=>{document.removeEventListener('mousemove',sc);document.removeEventListener('mouseup',up);};
  document.addEventListener('mousemove',sc); document.addEventListener('mouseup',up);
});

/* ---- playback ---- */
function loadSeg(i, at=0, autoplay=true){
  if(i<0||i>=P.ev.segs.length) return;
  P.seg=i;
  const seg=P.ev.segs[i], base=P.ev.dir, act=modeVids();
  for(const v of P.vids){
    const cam=v.dataset.cam, fn=seg.f[cam];
    if(fn && act.includes(v)){
      v.style.visibility='visible'; v._retries=0; v.src=mediaUrl(base+'/'+fn); v.playbackRate=P.speed; v.load();
    } else {
      v.pause(); v.removeAttribute('src'); v.load();
      v.style.visibility = fn ? 'visible' : 'hidden';
    }
  }
  // A fresh src resets currentTime and readyState still reports the OLD media right
  // after load(), so the seek is deferred to the rAF loop, which applies it once every
  // track has metadata.
  P.pendingSeek=at; P.loadedAt=performance.now();
  if(autoplay) playAll(); else updateBar();
}
const liveVids=()=>modeVids().filter(v=>v.getAttribute('src'));
/* A media request that dies mid-flight (connection reset, sleep/wake) errors the
   element for good; reload the same src at the same position, twice at most. */
function armRetry(v){
  v.addEventListener('error',()=>{
    const src=v.getAttribute('src'); if(!src) return;
    const n=v._retries||0; if(n>=2) return; v._retries=n+1;
    const at=v.currentTime;
    setTimeout(()=>{
      if(v.getAttribute('src')!==src) return;
      v.addEventListener('loadedmetadata',()=>{ try{v.currentTime=at;}catch(_){} if(P&&P.playing) v.play().catch(()=>{}); },{once:true});
      v.src=src; v.load();
    },400);
  });
}
armRetry(vMain);
function playAll(){ P.playing=true; document.getElementById('bPlay').textContent='❚❚';
  liveVids().forEach(v=>v.play().catch(()=>{})); }
function pauseAll(){ if(!P) return; P.playing=false; document.getElementById('bPlay').textContent='▶';
  liveVids().forEach(v=>v.pause()); }
function togglePlay(){ P.playing?pauseAll():playAll(); }
function masterV(){ return liveVids()[0]; }
function globalTime(){
  if(P.seg<0) return 0;
  if(P.pendingSeek!=null) return P.offs[P.seg]+P.pendingSeek;
  const m=masterV(); return P.offs[P.seg]+(m&&m.currentTime||0);
}
function seekGlobal(t, play){
  if(!P || !P.ev.segs.length) return;
  t=Math.max(0,Math.min(P.total-.05,t));
  let i=P.offs.length-1;
  while(i>0 && P.offs[i]>t) i--;
  const local=t-P.offs[i];
  const wantPlay = play===undefined ? P.playing : play;
  if(i!==P.seg) loadSeg(i, local, wantPlay);
  else {
    P.pendingSeek=null;
    for(const v of liveVids()){ try{v.currentTime=local;}catch(_){} }
    if(wantPlay && !P.playing) playAll();
    updateBar();
  }
}
function updateBar(){
  if(!P) return;
  const t=globalTime(), p=pct(t);
  document.getElementById('played').style.width=p;
  document.getElementById('knob').style.left=p;
  const w=windowOf(P.ev);
  // A player that never gets metadata is the "black player": say so instead of
  // looking idle, and name the way out.
  const lv=liveVids(), stuck=lv.length && lv.some(v=>v.readyState<1) && performance.now()-(P.loadedAt||0)>6000;
  document.getElementById('tPos').textContent=
    `${fmtDur(t)} / ${fmtDur(P.total)} · seg ${P.seg+1}/${P.ev.segs.length}${t<w[0]||t>w[1]?' · outside window':''}`
    +(stuck?' · still loading — reload the page (⌘R) if this persists':'');
}
/* drift correction + segment chaining */
function tick(){
  if(P && ov.classList.contains('show')){
    const vs=liveVids(), m=vs[0];
    if(P.pendingSeek!=null){
      if(vs.length && vs.every(v=>v.readyState>=1)){
        const at=P.pendingSeek; P.pendingSeek=null;
        for(const v of vs){ try{v.currentTime=at;}catch(_){} }
      }
      updateBar();
      return requestAnimationFrame(tick);
    }
    if(m){
      for(let i=1;i<vs.length;i++){
        const d=vs[i].currentTime-m.currentTime;
        if(Math.abs(d)>.28 && !vs[i].seeking){ try{vs[i].currentTime=m.currentTime;}catch(_){} }
      }
      // A video the browser paused on its own (hidden tab, media key, a dropped
      // request) is restarted while the page still says "playing" — the master too,
      // otherwise the clock freezes and the button lies. Ended ones stay ended.
      if(P.playing) for(const v of vs){ if(v.paused && !v.ended) v.play().catch(()=>{}); }
      if(P.playing && m.ended){
        if(P.seg+1<P.ev.segs.length) loadSeg(P.seg+1,0,true); else pauseAll();
      }
    }
    updateBar();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---- controls ---- */
document.getElementById('bPlay').onclick=togglePlay;
document.getElementById('bClose').onclick=closePlayer;
document.getElementById('bGrid').onclick=()=>{
  const t=P&&P.seg>=0 ? globalTime()-P.offs[P.seg] : 0, was=P&&P.playing;
  if(P) pauseAll();
  document.body.classList.toggle('gridmode');
  document.getElementById('bGrid').classList.toggle('on',isGrid());
  if(P&&P.seg>=0) loadSeg(P.seg, t, was);
};
document.getElementById('bSpeed').onclick=()=>{
  if(!P) return;
  P.speed = P.speed===1?2 : P.speed===2?4 : P.speed===4?8 : 1;
  document.getElementById('bSpeed').textContent=P.speed+'×';
  liveVids().forEach(v=>v.playbackRate=P.speed);
};
document.getElementById('bPrev').onclick=()=>step(-1);
document.getElementById('bNext').onclick=()=>step(1);
function step(d){
  const i=shown.indexOf(P.ev); if(i<0) return;
  const j=i+d; if(j<0||j>=shown.length){ toast(d>0?'last event':'first event'); return; }
  openEvent(shown[j]);
}
function closePlayer(){
  pauseAll(); ov.classList.remove('show'); document.body.style.overflow='';
  if(P) for(const v of P.vids) release(v);
  P=null; markSel(true);
}
function jumpTo(t){ if(t==null) return; seekGlobal(t); }

document.addEventListener('keydown',e=>{
  const tag=e.target.tagName;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA') return;
  const k=e.key;
  if(!ov.classList.contains('show')){
    if(!shown.length) return;
    if(k==='j'||k==='J'){ e.preventDefault(); selIdx=Math.min(shown.length-1,selIdx+1); markSel(true); }
    else if(k==='k'||k==='K'){ e.preventDefault(); selIdx=Math.max(0,selIdx-1); markSel(true); }
    else if(k==='Enter'){ if(selIdx>=0) openEvent(shown[selIdx]); }
    return;
  }
  if(k===' '){e.preventDefault();togglePlay();}
  else if(k==='Escape') closePlayer();
  else if(k==='ArrowLeft'){e.preventDefault();seekGlobal(globalTime()-(e.shiftKey?1:5));}
  else if(k==='ArrowRight'){e.preventDefault();seekGlobal(globalTime()+(e.shiftKey?1:5));}
  else if(k===','){ loadSeg(Math.max(0,P.seg-1),0,P.playing); }
  else if(k==='.'){ loadSeg(Math.min(P.ev.segs.length-1,P.seg+1),0,P.playing); }
  else if(k==='k'||k==='K') setKeep('keep');
  else if(k==='d'||k==='D') setKeep('drop');
  else if(k==='u'||k==='U') setKeep('unreviewed');
  else if(k==='i'||k==='I') setMark('in');
  else if(k==='o'||k==='O') setMark('out');
  else if(k==='[') jumpTo(windowOf(P.ev)[0]);
  else if(k===']') jumpTo(windowOf(P.ev)[1]);
  else if(k==='t') jumpTo(P.ev.trigger_s);
  else if(k==='T'){ e.preventDefault(); document.getElementById('tagIn').focus(); }
  else if(k==='n'||k==='N') step(1);
  else if(k==='p'||k==='P') step(-1);
  else if(k==='g'||k==='G') document.getElementById('bGrid').click();
  else if(/^[1-6]$/.test(k)){ const cam=P.cams[+k-1]; if(cam){ if(isGrid()) document.getElementById('bGrid').click(); swapMain(cam); } }
});

loadAll().then(()=>render()).catch(err=>{
  document.getElementById('list').innerHTML=`<div class="empty">Cannot load events: ${esc(err.message)}<br><br>Run <code>teslacam scan</code>, then <code>teslacam review</code>.</div>`;
  document.getElementById('stats').textContent='';
});
</script>
</body>
