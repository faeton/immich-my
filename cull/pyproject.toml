[project]
name = "cull"
version = "0.0.1"
description = "Review import candidates (keep/drop, trip) and stage the keepers into trip folders."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "timezonefinder>=6.5",
]

[project.optional-dependencies]
immich = ["psycopg[binary]>=3.1", "pyyaml>=6"]

[project.scripts]
cull = "cull.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cull"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9"]
